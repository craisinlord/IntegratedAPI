plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.2' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT' apply false
    id 'dev.architectury.loom' version '1.14.476' apply false
}

allprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = findProperty('mod_group_id') ?: 'com.craisinlord'
    version = findProperty('mod_version') ?: '1.0.0'

    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.shedaniel.me/' }
        maven { url = 'https://cursemaven.com' }
        maven { url = 'https://api.modrinth.com/maven' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://nexus.resourcefulbees.com/repository/telepathicgrunt/' }
        maven { url = 'https://jitpack.io' }
    }

    java {
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

def architecturyProjectNames = [
    'common-1.20.1', 'fabric-1.20.1', 'forge-1.20.1',
    'common-1.21.1', 'fabric-1.21.1', 'neoforge-1.21.1',
]

configure(architecturyProjectNames.collect { project(it) }) {
    apply plugin: 'architectury-plugin'
    apply plugin: 'dev.architectury.loom'

    loom {
        silentMojangMappingsLicense()
    }
}

tasks.named('jar') {
    enabled = false
}

def groupBDir = file('group-b')
def groupBWrapper = providers.systemProperty('os.name').get().toLowerCase().contains('win')
        ? new File(groupBDir, 'gradlew.bat')
        : new File(groupBDir, 'gradlew')

['build', 'assemble', 'clean', 'runClient', 'runServer'].each { name ->
    tasks.register("groupB${name.capitalize()}", Exec) {
        group = 'group-b'
        description = "Runs ':${name}' inside the group-b build"
        workingDir = groupBDir
        commandLine groupBWrapper.absolutePath, name
    }
}
